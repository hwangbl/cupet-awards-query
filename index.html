<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUPET 2026 高校获奖查询</title><style>:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#173447;background:#f3f6f9;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#073a4e;color:#fff;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px}header>span:last-child{font-size:14px;color:#c6dce5}.brand{font-size:23px;letter-spacing:2px}.brand b{color:#6de3c0}main{max-width:1250px;margin:auto;padding:40px 24px}.intro{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:30px}.eyebrow{letter-spacing:2px;font-size:13px;color:#177d78;font-weight:700}h1{font-size:36px;margin:14px 0}p{line-height:1.8}.intro p:not(.eyebrow){color:#587080}.stamp{font-size:14px;line-height:1.8;border-left:3px solid #37ab99;padding-left:16px;color:#527080}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:24px 0}.stat{padding:22px;background:white;border:1px solid #e0e8ed;border-radius:12px}.stat strong{display:block;font-size:30px;margin-bottom:5px}.stat span{font-size:14px;color:#587080}.stat:first-child{background:#073a4e;color:white}.stat:first-child span{color:#d7e5ea}.panel{background:white;border:1px solid #dfe7ec;border-radius:16px;padding:24px}label{font-size:14px;font-weight:600;display:block}input,select,button{font:inherit}input{width:100%;padding:16px;border:1px solid #b9cdd7;border-radius:8px;margin:10px 0;font-size:18px}input:focus,select:focus{outline:2px solid #129c90;outline-offset:2px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{font-size:14px;padding:7px 12px;background:#eff6f7;border:0;color:#285d6c}.filters{display:flex;gap:18px;align-items:end;flex-wrap:wrap;margin-top:22px}select{display:block;margin-top:8px;padding:10px 32px 10px 12px;border:1px solid #ccdbe2;border-radius:6px;background:white;color:#234959}button{border:1px solid #c8d8e1;background:white;color:#254d60;border-radius:7px;padding:11px 17px;cursor:pointer}button:hover{background:#e6f3f1}nav{display:flex;gap:8px;margin:28px 0 18px}nav .active{background:#073a4e;color:white;border-color:#073a4e}#export{margin-left:auto}.resultbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}#hint{font-size:14px;color:#657983}.card{background:white;border:1px solid #dfe7ec;border-radius:12px;padding:22px;margin-bottom:12px}.top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.school{font-size:18px;font-weight:700;cursor:pointer;color:#085d72}.tag{font-size:13px;border-radius:5px;background:#eaf4f5;color:#226679;padding:4px 8px}.pending{background:#fff1d6;color:#895908}.title{font-size:18px;margin:14px 0 8px}.meta{font-size:14px;color:#617788;line-height:1.8}.tablewrap{overflow:auto;background:white;border:1px solid #dfe7ec;border-radius:12px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:16px;border-bottom:1px solid #e5edf1}th{font-size:14px;background:#eaf1f4}td button{border:0;padding:0;text-align:left;background:none}.empty{text-align:center;padding:65px;color:#526e80;background:white;border-radius:12px}.method{background:#e8eff3;padding:20px;margin-top:28px;border-radius:12px;font-size:14px}.method summary{cursor:pointer;font-weight:600}footer{font-size:13px;color:#637d8a;text-align:center;margin-top:32px}.campus{font-size:13px;color:#637d8a} @media(max-width:650px){main{padding:24px 14px}h1{font-size:28px}.stamp{display:none}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:15px}.stat:first-child{grid-column:span 2}.stat strong{font-size:25px}.panel{padding:16px}.filters{gap:12px}.filters label{flex:1;min-width:130px}select{width:100%}header{align-items:start}header>span:last-child{max-width:140px}.resultbar{flex-direction:column}nav{flex-wrap:wrap}#export{font-size:14px}.title{font-size:17px}}
</style><body><header><span class="brand">CUPET <b>2026</b></span><span>全国大学生物理实验竞赛 · 创新</span></header><main><div class="intro"><div><p class="eyebrow">AWARDS EXPLORER / 高校获奖查询</p><h1>查询高校获奖情况</h1><p>输入高校全称，查询该校的拟授一等奖作品。</p></div></div><section class="panel"><form id="search"><label for="school">高校全称</label><input id="school" required minlength="3" maxlength="60" placeholder="例如：电子科技大学"><button>查询</button></form><div class="chips" style="margin-top:16px"><button data-name="电子科技大学">电子科技大学</button><button data-name="四川师范大学">四川师范大学</button><button data-name="杭州电子科技大学">杭州电子科技大学</button><button data-name="中南林业科技大学">中南林业科技大学</button></div></section><div class="stats" id="stats"></div><div class="resultbar"><strong id="count" aria-live="polite">请输入高校全称</strong></div><div id="results"></div><details class="method"><summary>统计口径与数据说明</summary><p>本网页根据现场拟授一等奖名单整理，赛道包括命题、自选、讲课和国际。作品题名为概要，辅助辨认项目仍需核对；未检出不代表未参赛。名单序号不等于成绩排名。</p><p>按高校全称查询，未注明校区一般按本部处理；四川师范大学为多校区学校，各项目校区待核。原始照片和完整数据文件不在公开网页中。</p></details><footer>CUPET 2026 · 高校获奖查询</footer></main><script>
const endpoint='https://uthmwaopzuudunbkguqm.supabase.co/functions/v1/school-search';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cats=['命题类','自选类','讲课类','国际赛道'];let controller;
async function search(){const q=document.getElementById('school').value.trim();if(q.length<3){document.getElementById('count').textContent='请输入完整高校名称';return}controller?.abort();controller=new AbortController();document.getElementById('count').textContent='正在查询…';document.getElementById('results').innerHTML='';document.getElementById('stats').innerHTML='';try{const r=await fetch(endpoint+'?school='+encodeURIComponent(q),{signal:controller.signal});if(!r.ok)throw Error();const rows=await r.json();document.getElementById('count').textContent=rows.length?q+' · 共 '+rows.length+' 项拟授一等奖':'未查到该高校，请检查全称；未检出不代表未参赛。';document.getElementById('stats').innerHTML=rows.length?[['合计',rows.length],...cats.map(c=>[c,rows.filter(x=>x.category===c).length])].map(([a,b])=>`<div class="stat"><strong>${b}</strong><span>${a}</span></div>`).join(''):'';document.getElementById('results').innerHTML=rows.map(x=>`<article class="card"><div class="top"><strong>${esc(x.school)}</strong><span class="tag ${x.status==='辅助辨认'?'pending':''}">${esc(x.status)}</span></div><p class="title">${esc(x.topic)}</p><div class="meta">${esc(x.category)} · 原序号 ${esc(x.id)} · 名单第 ${esc(x.page)} 页<br>${esc(x.campus_status||'原名单未单列校区')} · 题名以原始名单为准</div></article>`).join('')}catch(e){if(e.name!=='AbortError')document.getElementById('count').textContent='查询暂时不可用，请稍后重试。'}}document.getElementById('search').onsubmit=e=>{e.preventDefault();search()};document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{document.getElementById('school').value=b.dataset.name;search()});</script></body></html>
